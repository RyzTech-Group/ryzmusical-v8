<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Coming Soon - RyzTech Company Group</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}.pg,.pg *{touch-action:none;-webkit-user-drag:none;cursor:pointer}
.pg{position:relative;overflow:hidden;width:100%;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(34px,3.6vh);padding:3vh 4vw;background:linear-gradient(160deg,#f8fbff,#dde9ff 55%,#f4f8ff);font-family:Montserrat,Arial,sans-serif}
.bands{position:absolute;inset:-20%;background:repeating-linear-gradient(135deg,transparent 0 150px,#ffffff99 150px 290px,transparent 290px 420px);animation:drift 14s linear infinite}
.corner{position:absolute;width:38vw;max-width:520px;aspect-ratio:1.7;background:linear-gradient(135deg,#021a6e,#0a4fe0 65%,#2a85ff);clip-path:polygon(0 0,100% 0,0 100%);animation:cin 1.2s cubic-bezier(.2,.8,.2,1) both,glow 5s ease-in-out 1.2s infinite alternate}
.corner.b{right:0;bottom:0;transform:rotate(180deg);animation-name:cinb,glowb}
.corner.b2,.corner.t2{position:absolute;width:44vw;max-width:600px;aspect-ratio:1.7;background:#7fb0ff66;clip-path:polygon(0 0,100% 0,0 100%);animation:glow 6s ease-in-out infinite alternate}
.corner.t2{left:0;top:0}.corner.b2{right:0;bottom:0;transform:rotate(180deg);animation-name:glowb}
.corner.t{left:0;top:0}
.ttl{position:relative;width:min(940px,92vw);text-align:center;animation:up 1s .2s cubic-bezier(.2,.8,.2,1) both}
.w1,.w2{display:block;font-family:'Archivo Black','Arial Black',sans-serif;font-size:min(11.5vw,16vh,150px);line-height:.98;letter-spacing:-.01em}
.w1{color:#0a1f6e;animation:float 4s ease-in-out infinite}
.w2{background:linear-gradient(100deg,#0a5ff0 30%,#6aa6ff 50%,#0a5ff0 70%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite,float 4s ease-in-out -2s infinite}
.sw{position:absolute;inset:-8% -3%;width:106%;height:116%;pointer-events:none;overflow:visible}
.sw path{fill:none;stroke:#0a5ff0;stroke-width:6;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;animation:draw 5s ease-in-out infinite}
.sp{position:absolute;width:clamp(22px,4vw,40px);animation:tw 2.4s ease-in-out infinite}
.sp.a{left:-2%;top:38%}.sp.c{right:-2%;top:68%;animation-delay:-1.2s}
.sub{position:relative;margin:0;font-weight:700;font-size:clamp(11px,1.9vw,22px);letter-spacing:.5em;color:#0a1f6e;text-align:center;animation:up 1s .6s both,breathe 5s ease-in-out 1.6s infinite}
.eqrow{position:relative;display:flex;align-items:center;justify-content:center;gap:28px;width:min(880px,90vw);animation:up 1s .9s both}
.ln{flex:1;height:2px;background:linear-gradient(90deg,transparent,#0a5ff0);transform-origin:right;animation:ln 3s ease-in-out infinite alternate}
.ln.r{background:linear-gradient(270deg,transparent,#0a5ff0);transform-origin:left}
.eq{display:flex;align-items:center;gap:7px;height:min(64px,7vh)}
.bar{display:block;width:8px;height:100%;border-radius:4px;background:linear-gradient(#8fb9ff,#0a5ff0);transform:scaleY(var(--lo));animation:eq var(--d) ease-in-out var(--dl) infinite alternate}
.pill{position:relative;display:flex;align-items:center;gap:14px;padding:14px 34px;border:2px solid #0a3fd0;border-radius:999px;font-weight:700;font-size:clamp(12px,1.7vw,20px);color:#0a1f6e;letter-spacing:.04em;animation:up 1s 1.2s both,pulse 2.8s ease-in-out 2s infinite}
.pill i{display:block;width:22px;height:2px;background:#0a3fd0;animation:dash 1.6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(420px,-420px)}}
@keyframes cin{from{transform:translate(-40%,-40%);opacity:0}}
@keyframes cinb{from{transform:rotate(180deg) translate(-40%,-40%);opacity:0}to{transform:rotate(180deg)}}
@keyframes glow{to{filter:brightness(1.25) saturate(1.2);transform:translate(10px,10px)}}
@keyframes glowb{from{transform:rotate(180deg)}to{filter:brightness(1.25) saturate(1.2);transform:rotate(180deg) translate(10px,10px)}}
@keyframes up{from{opacity:0;transform:translateY(34px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes draw{0%{stroke-dashoffset:100}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@keyframes tw{0%,100%{transform:scale(.5) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
@keyframes breathe{50%{letter-spacing:.62em}}
@keyframes eq{to{transform:scaleY(var(--hi))}}
@keyframes ln{from{transform:scaleX(.55);opacity:.6}to{transform:scaleX(1);opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 8px #0a5ff022,0 0 28px #0a5ff055}}
@keyframes dash{to{width:36px}}
@media (prefers-reduced-motion:reduce){.pg *{animation:none!important}}
</style>
</head>
<body>
<div class="pg">
<div class="bands"></div>
<div class="corner t2"></div><div class="corner t"></div>
<div class="corner b2"></div><div class="corner b"></div>
<div class="ttl">
<svg class="sw" viewBox="0 0 940 330" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M430 60C640-10 900 5 905 85 905 135 860 175 810 205"/><path pathLength="100" style="animation-delay:-2.5s" d="M365 305C250 335 60 345 40 270 30 235 70 200 125 165"/></svg>
<svg class="sp a" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#0a5ff0"/></svg>
<svg class="sp c" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="#0a5ff0"/></svg>
<h1 style="margin:0"><span class="w1">COMING</span><span class="w2">SOON</span></h1>
</div>
<p class="sub">A NEW EXPERIENCE IS ON THE WAY</p>
<div class="eqrow" aria-hidden="true"><i class="ln"></i><div class="eq"><i class="bar" style="--lo:0.25;--hi:0.55;--d:1.1s;--dl:-0.0s"></i><i class="bar" style="--lo:0.3;--hi:0.8;--d:0.9s;--dl:-0.08s"></i><i class="bar" style="--lo:0.35;--hi:0.7;--d:1.3s;--dl:-0.24s"></i><i class="bar" style="--lo:0.2;--hi:0.6;--d:0.8s;--dl:-0.22s"></i><i class="bar" style="--lo:0.3;--hi:0.95;--d:1.0s;--dl:-0.36s"></i><i class="bar" style="--lo:0.25;--hi:1;--d:1.2s;--dl:-0.55s"></i><i class="bar" style="--lo:0.3;--hi:0.85;--d:0.85s;--dl:-0.46s"></i><i class="bar" style="--lo:0.2;--hi:0.65;--d:1.15s;--dl:-0.73s"></i><i class="bar" style="--lo:0.3;--hi:0.75;--d:0.95s;--dl:-0.69s"></i><i class="bar" style="--lo:0.25;--hi:0.55;--d:1.25s;--dl:-1.02s"></i><i class="bar" style="--lo:0.3;--hi:0.45;--d:1.05s;--dl:-0.95s"></i></div><i class="ln r"></i></div>
<div class="pill"><i></i>RYZTECH COMPANY GROUP<i></i></div>
</div>
<script>
(function(){var d=document,e=d.documentElement;
function isFs(){return d.fullscreenElement||d.webkitFullscreenElement}
function go(){if(isFs())return;var f=e.requestFullscreen||e.webkitRequestFullscreen;if(f){try{var p=f.call(e);if(p&&p.catch)p.catch(function(){})}catch(x){}}}
d.addEventListener("pointerup",go);
function stop(ev){ev.preventDefault()}
var o={passive:!1};
["touchmove","wheel","gesturestart","gesturechange","contextmenu","dragstart","selectstart"].forEach(function(t){d.addEventListener(t,stop,o)});
d.addEventListener("keydown",function(ev){if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","PageUp","PageDown","Home","End"].indexOf(ev.key)>-1)ev.preventDefault()});
})();
</script>
</body>
</html>
